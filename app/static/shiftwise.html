<!DOCTYPE html>
<html>
<head>
    <title>Shiftwise Energy Monitor</title>
</head>
<body>
    <div id="data"></div>
    <script>
        const eventSource = new EventSource('http://172.18.7.93:8989/api/v1/energy-monitoring/shiftwise-energy-stream');

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            document.getElementById('data').innerHTML = JSON.stringify(data, null, 2);
        };
    </script>
</body>
</html>
